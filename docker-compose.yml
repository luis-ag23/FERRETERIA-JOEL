# =============================================================================
# Escalamiento horizontal del monolito Ferretería Joel  (2do entregable ARQ)
# =============================================================================
#
# Topología:
#
#     Navegador
#         |
#         v
#     Nginx  (fj-nginx)            <- balanceador / proxy frontal
#         |  round-robin + failover automático
#         +--> app1  (fj-app1)     <- réplica de servicio
#         +--> app2  (fj-app2)     <- réplica de servicio
#         +--> app3  (fj-app3)     <- réplica de servicio
#         +--> app4  (fj-app4)     <- RÉPLICA DE DEFENSA (reserva)
#         |
#         +--> MySQL  (fj-mysql)   <- sistema de registro (datos maestros)
#         +--> Redis  (fj-redis)   <- caché distribuida + sesión + claves
#
# -----------------------------------------------------------------------------
# PAPEL DE LA CUARTA RÉPLICA (app4) EN LA DEFENSA
# -----------------------------------------------------------------------------
# app4 NO es una copia de app1..app3: es la réplica de reserva que permite
# demostrar en vivo la Alta Disponibilidad durante la defensa. Con las cuatro
# réplicas levantadas el sistema ya es tolerante a un fallo (Nginx reintenta
# contra otra réplica con proxy_next_upstream), pero con TRES réplicas de
# servicio y UNA de reserva la demostración es mucho más clara:
#
#   1) Se detiene la réplica de reserva y se comprueba que el sistema sigue
#      respondiendo con normalidad:
#
#         docker compose stop app4
#         curl -i http://localhost/ | findstr /I "X-Replica"
#
#   2) Se detiene además una réplica de servicio y se comprueba que Nginx
#      reintenta solo contra otra réplica (failover, sin error para el
#      usuario):
#
#         docker compose stop app1
#         curl -i http://localhost/ | findstr /I "X-Replica"
#
#   3) Se levantan de nuevo y se comprueba que el balanceo round-robin
#      vuelve a repartir el tráfico entre las cuatro:
#
#         docker compose start app1 app4
#         1..4 | %% curl -s -o NUL -w "%%{http_code} " http://localhost/
#
# La reserva también sirve para el caso de que una réplica de servicio falle
# durante la defensa: se levanta con "docker compose start app4" y el sistema
# recupera capacidad sin interventionar el código.
#
# -----------------------------------------------------------------------------
# AVISO OPERATIVO DURANTE LA DEFENSA
# -----------------------------------------------------------------------------
#   * Para vaciar la caché usa el borrado por patrón:
#         docker exec fj-redis redis-cli --scan --pattern "ferreteria:cache:*" \
#           | xargs -r -I{} docker exec fj-redis redis-cli DEL {}
#     NO uses "redis-cli FLUSHALL": borraría también la clave
#     "FerreteriaJoel-DataProtection-Keys" (las claves de Data Protection
#     compartidas) y las cookies de sesión dejarían de ser válidas en las
#     réplicas distintas de la que las emitió.
#   * "docker compose down -v" borra los volúmenes: se regenera la base de
#     datos con Scripts/init-completo.sql y se pierde la sesión abierta.
#     Para reiniciar el sistema sin perder el estado: "docker compose restart".
#
# -----------------------------------------------------------------------------
# ARCHIVOS QUE INTERVIENEN EN LA DEFENSA
# -----------------------------------------------------------------------------
#   docker-compose.yml                     este archivo: topología, réplicas,
#                                          variables de entorno y volúmenes.
#   nginx/nginx.conf                       balanceo round-robin, cabeceras
#                                          X-Replica-Id / X-Replica-Served y
#                                          failover con proxy_next_upstream.
#   Program.cs                             cabecera X-Replica-Id, sesiones
#                                          compartidas y secretos de arranque.
#   FERRETERIA__Joel.Infraestructura/
#     Servicios/IdentificadorReplica.cs    identificador único de cada réplica.
#     Servicios/CacheSeleccionRedis.cs     caché distribuida sobre Redis.
#     Servicios/RedisCacheHelper.cs        lectura/escritura de claves y TTL.
#   docker/entrypoint.sh                   certificado de Data Protection
#                                          compartido por las 4 réplicas.
#   Scripts/init-completo.sql              único script de base de datos: es el
#                                          que monta Docker (esquema + semilla).
#   .env / .env.example                    secretos (no versionado / plantilla).
#
# -----------------------------------------------------------------------------
# SECRETOS
# -----------------------------------------------------------------------------
# Los secretos NO están en este archivo: se toman de variables de entorno
# definidas en el archivo .env de la raiz (no versionado). Copie .env.example
# a .env y complete los valores antes de levantar el proyecto:
#
#   cp .env.example .env
#
# Valores por defecto admitidos con la sintaxis ${VAR:-valor}.

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: always
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    # Volumen compartido con las cuatro replicas: contiene el certificado con
    # el que se cifran las claves de Data Protection. Tiene que ser el mismo
    # en todas ellas para que una cookie emitida por una replica sea valida
    # en las demas.
    - proteccion_datos:/var/ferreteria/proteccion
  networks:
    - ferreteria-net
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  mysql:
    image: mysql:8.0
    container_name: fj-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD en el archivo .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bdferreteria}
    ports:
      - "${MYSQL_PUERTO_HOST:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Scripts/init-completo.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - ferreteria-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fj-redis
    restart: always
    ports:
      - "${REDIS_PUERTO_HOST:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - ferreteria-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app1:
    <<: *app-common
    container_name: fj-app1
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - HOSTNAME=app1
      - ConnectionStrings__MySqlConnection=Server=mysql;Database=${MYSQL_DATABASE:-bdferreteria};Uid=root;Pwd=${MYSQL_ROOT_PASSWORD};Port=3306;
      - Redis__Connection=redis:6379
      - Redis__SessionTtlMinutes=${REDIS_SESSION_TTL_MINUTES:-30}
      - Redis__CacheTtlMinutes=${REDIS_CACHE_TTL_MINUTES:-5}
      - UrlProteccion__Clave=${URL_PROTECCION_CLAVE:?defina URL_PROTECCION_CLAVE en el archivo .env}
      - Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - Smtp__Puerto=${SMTP_PUERTO:-587}
      - Smtp__Usuario=${SMTP_USUARIO:-}
      - Smtp__Clave=${SMTP_CLAVE:-}
      - Smtp__UsarSsl=${SMTP_USAR_SSL:-true}
      - Smtp__Remitente=${SMTP_REMITENTE:-}
      - Smtp__RemitenteNombre=${SMTP_REMITENTE_NOMBRE:-Ferretería Joel}
      - DataProtection__CertificadoRuta=/var/ferreteria/proteccion/proteccion.pfx

  app2:
    <<: *app-common
    container_name: fj-app2
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - HOSTNAME=app2
      - ConnectionStrings__MySqlConnection=Server=mysql;Database=${MYSQL_DATABASE:-bdferreteria};Uid=root;Pwd=${MYSQL_ROOT_PASSWORD};Port=3306;
      - Redis__Connection=redis:6379
      - Redis__SessionTtlMinutes=${REDIS_SESSION_TTL_MINUTES:-30}
      - Redis__CacheTtlMinutes=${REDIS_CACHE_TTL_MINUTES:-5}
      - UrlProteccion__Clave=${URL_PROTECCION_CLAVE:?defina URL_PROTECCION_CLAVE en el archivo .env}
      - Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - Smtp__Puerto=${SMTP_PUERTO:-587}
      - Smtp__Usuario=${SMTP_USUARIO:-}
      - Smtp__Clave=${SMTP_CLAVE:-}
      - Smtp__UsarSsl=${SMTP_USAR_SSL:-true}
      - Smtp__Remitente=${SMTP_REMITENTE:-}
      - Smtp__RemitenteNombre=${SMTP_REMITENTE_NOMBRE:-Ferretería Joel}
      - DataProtection__CertificadoRuta=/var/ferreteria/proteccion/proteccion.pfx

  app3:
    <<: *app-common
    container_name: fj-app3
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - HOSTNAME=app3
      - ConnectionStrings__MySqlConnection=Server=mysql;Database=${MYSQL_DATABASE:-bdferreteria};Uid=root;Pwd=${MYSQL_ROOT_PASSWORD};Port=3306;
      - Redis__Connection=redis:6379
      - Redis__SessionTtlMinutes=${REDIS_SESSION_TTL_MINUTES:-30}
      - Redis__CacheTtlMinutes=${REDIS_CACHE_TTL_MINUTES:-5}
      - UrlProteccion__Clave=${URL_PROTECCION_CLAVE:?defina URL_PROTECCION_CLAVE en el archivo .env}
      - Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - Smtp__Puerto=${SMTP_PUERTO:-587}
      - Smtp__Usuario=${SMTP_USUARIO:-}
      - Smtp__Clave=${SMTP_CLAVE:-}
      - Smtp__UsarSsl=${SMTP_USAR_SSL:-true}
      - Smtp__Remitente=${SMTP_REMITENTE:-}
      - Smtp__RemitenteNombre=${SMTP_REMITENTE_NOMBRE:-Ferretería Joel}
      - DataProtection__CertificadoRuta=/var/ferreteria/proteccion/proteccion.pfx

  # ---------------------------------------------------------------------------
  # app4: REPLICA DE DEFENSA (reserva).
  #
  # Es idéntica a app1..app3 (misma imagen, misma configuracion, mismo volumen
  # de Data Protection) y por eso puede atender trafico normal en cualquier
  # momento. Su funcion es ser la replica de reserva: durante la defensa se
  # detiene para mostrar el failover y, si una replica de servicio falla, se
  # levanta al instante con "docker compose start app4" para recuperar
  # capacidad.
  # ---------------------------------------------------------------------------
  # app4:
  #   <<: *app-common
  #   container_name: fj-app4
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Docker
  #     - HOSTNAME=app4
  #     - ConnectionStrings__MySqlConnection=Server=mysql;Database=${MYSQL_DATABASE:-bdferreteria};Uid=root;Pwd=${MYSQL_ROOT_PASSWORD};Port=3306;
  #     - Redis__Connection=redis:6379
  #     - Redis__SessionTtlMinutes=${REDIS_SESSION_TTL_MINUTES:-30}
  #     - Redis__CacheTtlMinutes=${REDIS_CACHE_TTL_MINUTES:-5}
  #     - UrlProteccion__Clave=${URL_PROTECCION_CLAVE:?defina URL_PROTECCION_CLAVE en el archivo .env}
  #     - Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
  #     - Smtp__Puerto=${SMTP_PUERTO:-587}
  #     - Smtp__Usuario=${SMTP_USUARIO:-}
  #     - Smtp__Clave=${SMTP_CLAVE:-}
  #     - Smtp__UsarSsl=${SMTP_USAR_SSL:-true}
  #     - Smtp__Remitente=${SMTP_REMITENTE:-}
  #     - Smtp__RemitenteNombre=${SMTP_REMITENTE_NOMBRE:-Ferretería Joel}
  #     - DataProtection__CertificadoRuta=/var/ferreteria/proteccion/proteccion.pfx

  nginx:
    image: nginx:alpine
    container_name: fj-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PUERTO_HOST:-80}:80"
    depends_on:
      - app1
      - app2
      - app3
      #- app4
    networks:
      - ferreteria-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  proteccion_datos:

networks:
  ferreteria-net:
    driver: bridge
