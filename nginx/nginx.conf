events {
    worker_connections 1024;
}

http {
    # Registro de la distribucion de peticiones entre replicas.
    log_format fj '$remote_addr - $host [$time_local] "$request" '
                   '$status $body_bytes_sent upstream=$upstream_addr '
                   'tiempo=$upstream_response_time';

    access_log /var/log/nginx/access.log fj;

    upstream ferreteria_backend {
        # Balanceo round-robin entre las cuatro replicas del monolito.
        #
        # max_fails y fail_timeout definen la politica de failover: tras
        # max_fails errores en fail_timeout segundos, Nginx marca la replica
        # como no disponible y deja de enviarle peticiones. Al vencer el
        # plazo vuelve a probarla.
        server app1:8080 max_fails=3 fail_timeout=10s;
        server app2:8080 max_fails=3 fail_timeout=10s;
        server app3:8080 max_fails=3 fail_timeout=10s;
        #server app4:8080 max_fails=3 fail_timeout=10s;

        # Mantiene las conexiones abiertas hacia las replicas.
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Tamano de buffer para cookies grandes (DataProtection + Antiforgery)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Sonda de salud: responde Nginx sin tocar el backend, para que el
        # healthcheck del propio contenedor sea independiente del estado de
        # las replicas.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://ferreteria_backend;
            proxy_http_version 1.1;

            # Cabeceras que le permiten a la aplicacion reconstruir la
            # peticion original (protocolo, host y direccion del cliente).
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";

            # Evidencia de escalamiento: la replica que atendio la peticion.
            # X-Replica-Served lo escribe Nginx (direccion del upstream) y
            # X-Replica-Id lo escribe la propia replica (nombre del
            # contenedor).
            add_header X-Replica-Served $upstream_addr always;
            proxy_pass_header X-Replica-Id;

            # Failover explicito: si la replica no responde, esta misma
            # peticion se reenvia a otra replica sin que el cliente lo note.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 4;
            proxy_next_upstream_timeout 15s;

            # Pasar cookies sin modificar
            proxy_pass_header Set-Cookie;
            proxy_pass_header Cookie;

            # Timeouts.
            # El timeout de conexion es corto a proposito: dentro de la red de
            # Docker una replica sana responde de inmediato, asi que si no
            # conecta en 5 segundos esta caida y el failover actua en el
            # momento, sin dejar al cliente esperando.
            proxy_connect_timeout 5s;

            # Los tiempos de lectura y envio son largos porque algunas
            # operaciones (por ejemplo, generar el PDF del comprobante)
            # pueden tardar.
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
