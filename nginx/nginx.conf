events {
    worker_connections 1024;
}

http {
    upstream ferreteria_backend {
        # Balanceo round-robin por defecto
        server app1:8080;
        server app2:8080;
        server app3:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Tamaño de buffer para cookies grandes (DataProtection + Antiforgery)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        location / {
            proxy_pass http://ferreteria_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Upstream $upstream_addr;
            
            # Pasar cookies sin modificar
            proxy_pass_header Set-Cookie;
            proxy_pass_header Cookie;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
